version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      radix: { patterns: ["@radix-ui/*"] }
      tooling: { patterns: ["typescript", "vitest", "tsup", "turbo", "tsx"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
