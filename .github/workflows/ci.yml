name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Build, lint, typecheck and test on every supported Node line (package.json `engines`: >=22; .nvmrc is the
    # development default). The documentation, MCP and artifact steps run once, on Node 22.
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (fails if any contrast pair fails)
        run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Icon imports resolve
        run: node scripts/check-icons.mjs
      - name: Grid stylesheet built from tokens
        run: test -s packages/grid/dist/styles.css
      - name: Generate llms.txt and llms-full.txt
        if: matrix.node == 22
        run: pnpm build:llms
      - name: Build documentation site
        if: matrix.node == 22
        run: pnpm --filter ./apps/docs build
      - name: llms files shipped in the site
        if: matrix.node == 22
        run: test -s apps/docs/dist/llms.txt && test -s apps/docs/dist/llms-full.txt
      - name: MCP dataset and server start
        run: |
          test -s packages/mcp/data/faun.json
          node packages/mcp/dist/cli.js --help
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: docs
          path: apps/docs/dist
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: contrast-report
          path: packages/tokens/dist/docs/contrast.md

  generated-drift:
    # Runs every generator (colour scales, data-viz palettes, tokens build, icons, barrels, docs props.json, MCP data,
    # llms files) and fails when a committed generated file changed, or when a generator is not reproducible.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate everything twice
        run: node scripts/check-generated.mjs --twice
      - name: Committed generated files are unchanged
        run: git diff --exit-code
      - name: No new untracked files appeared
        run: test -z "$(git ls-files --others --exclude-standard)"

  preflight:
    # Informational: prints the publish preflight (including the list of things only a person can do) in the log.
    # It fails while CODEOWNERS still has its placeholder, so it is not a required check.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/preflight-publish.mjs --offline --no-pack

  consumer:
    # Installs the packed tarballs into a fresh Vite app and a fresh Next.js app, type-checks, builds and
    # loads both in Chromium. Proves that what we publish works for someone who only has the tarballs.
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # apt on hosted runners occasionally stalls; bound each attempt and retry once
      - run: timeout 300 pnpm exec playwright install chromium || timeout 300 pnpm exec playwright install chromium
      - run: node scripts/consumer-smoke.mjs

  e2e:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter @faun-ds/docs build
      # apt on hosted runners occasionally stalls; bound each attempt and retry once
      - run: timeout 300 pnpm exec playwright install chromium || timeout 300 pnpm exec playwright install chromium
      - run: pnpm e2e
