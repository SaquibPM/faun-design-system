name: Consumer smoke (registry)

# After publishing under the `next` dist-tag: installs the published packages from the npm registry into a fresh Vite
# and Next.js app and loads both in Chromium. Run this before promoting `next` to `latest` (docs/RELEASING.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "dist-tag or exact version to install"
        type: string
        default: next

permissions:
  contents: read

jobs:
  registry-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apt on hosted runners occasionally stalls; bound each attempt and retry once
      - run: timeout 300 pnpm exec playwright install chromium || timeout 300 pnpm exec playwright install chromium
      - run: node scripts/consumer-smoke.mjs --registry --tag "${{ inputs.tag }}"
